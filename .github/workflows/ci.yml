name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: core

jobs:
  check:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Every target in ARCHITECTURE §2. Desktop targets build the whole workspace;
  # mobile targets build only what ships there (core + ffi).
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, packages: --workspace }
          - { os: macos-latest, target: x86_64-apple-darwin, packages: --workspace }
          - { os: macos-latest, target: aarch64-apple-ios, packages: -p dhow-core -p dhow-ffi }
          - { os: macos-latest, target: aarch64-apple-ios-sim, packages: -p dhow-core -p dhow-ffi }
          - { os: macos-latest, target: x86_64-apple-ios, packages: -p dhow-core -p dhow-ffi }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, packages: --workspace }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, packages: --workspace }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, packages: --workspace }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, packages: --workspace }
          # Android API level is provisional until M7.
          - { os: ubuntu-latest, target: aarch64-linux-android, packages: -p dhow-core -p dhow-ffi, ndk_clang: aarch64-linux-android26-clang }
          - { os: ubuntu-latest, target: armv7-linux-androideabi, packages: -p dhow-core -p dhow-ffi, ndk_clang: armv7a-linux-androideabi26-clang }
          - { os: ubuntu-latest, target: x86_64-linux-android, packages: -p dhow-core -p dhow-ffi, ndk_clang: x86_64-linux-android26-clang }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.target }}
      - name: Point cargo at the NDK toolchain
        if: matrix.ndk_clang
        shell: bash
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${upper}_LINKER=$bin/${{ matrix.ndk_clang }}" >> "$GITHUB_ENV"
          echo "CC_${{ matrix.target }}=$bin/${{ matrix.ndk_clang }}" >> "$GITHUB_ENV"
          echo "AR_${{ matrix.target }}=$bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo build --locked --target ${{ matrix.target }} ${{ matrix.packages }}
