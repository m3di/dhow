[workspace]
resolver = "3"
members = ["dhow-core", "dhow-cli", "dhow-testserver", "dhow-ffi", "../spec-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
dhow-core = { path = "dhow-core" }
dhow-testserver = { path = "dhow-testserver" }
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
