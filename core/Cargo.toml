[workspace]
resolver = "3"
members = ["dhow-core", "dhow-cli", "dhow-testserver", "dhow-ffi", "../spec-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
dhow-core = { path = "dhow-core" }
dhow-testserver = { path = "dhow-testserver" }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync"] }
