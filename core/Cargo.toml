[workspace]
resolver = "3"
members = ["dhow-core", "dhow-cli", "dhow-testserver", "dhow-ffi", "../spec-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
dhow-core = { path = "dhow-core" }
dhow-testserver = { path = "dhow-testserver" }
base64 = "0.22"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
dirs = "6"
fastrand = "2"
flume = "0.12"
fs4 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
httpdate = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy"] }
jiff = "0.2"
md-5 = "0.11"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "socks"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uniffi = "0.32"
uuid = { version = "1", features = ["v7"] }
